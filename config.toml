# 이 파일만 고치면 동작이 바뀝니다. 코드는 건드리지 않아도 됩니다.

[delivery]
# 받는 주소. 보내는 Gmail 계정도 이 주소를 씁니다.
recipient = "vividori55790@gmail.com"
# 전송 방식: "daily"(매일), "weekly"(매주), "monthly"(매월), "manual"(수동 실행할 때만)
mode = "weekly"
# 보내는 시각 (한국 시간, 0~23)
hour = 8
# mode = "weekly"일 때 요일: mon, tue, wed, thu, fri, sat, sun
weekday = "mon"
# mode = "monthly"일 때 날짜 (1~28)
day_of_month = 1

[rules]
# 이 비율 이상이면 메일에 넣습니다. 30이면 30%, 40%, 50%... 모두 포함합니다.
threshold = 30
# 할인율을 확인하지 못한 글도 메일 맨 아래에 넣으려면 true
include_unconfirmed = false
# 이 일수보다 오래된 기사는 무시합니다.
max_age_days = 7

[collection]
# 커뮤니티 게시판은 실행될 때마다(약 15분) 읽고, 뉴스는 이 간격으로 읽습니다.
news_interval_hours = 6
# 한 번 실행에 쓰는 최대 시간(초). 넘으면 남은 소스는 다음 실행으로 미룹니다.
time_budget_seconds = 240

[llm]
# 선택 기능입니다. 저장소 Secrets에 GEMINI_API_KEY를 넣었을 때만 켜집니다.
# 할인율을 못 읽은 글만 물어보며, API가 끊기거나 오류가 나면 키워드 결과만으로 계속 동작합니다.
model = "gemini-3.5-flash-lite"
max_calls_per_run = 5

[keywords]
# 제목에 하나라도 있어야 하는 대상. 앞에 있는 항목이 먼저 대상으로 표시됩니다.
# 카카오페이, 토스페이 등을 추가하면 범위가 넓어집니다.
brands = [
  "네이버페이", "네이버 페이", "네이버머니", "네이버 머니", "Npay", "N페이", "엔페이",
  "삼성월렛", "삼성 월렛", "삼성페이", "삼성 페이", "월렛머니", "월렛 머니",
  "CU", "GS25", "세븐일레븐", "이마트24", "편의점",
]
# 혜택을 뜻하는 말. 제목에 없으면 비율이 있어도 행사로 보지 않습니다.
benefits = [
  "적립", "할인", "캐시백", "페이백", "환급", "돌려", "혜택", "쿠폰", "세일", "특가", "반값", "OFF",
]
# 제목이나 요약에 있으면 "누구나 참여"가 아니라고 보고 제외합니다.
ineligible = [
  "SKT", "KT", "LG U", "LGU", "유플러스", "통신사", "픽업", "멤버십", "신규", "첫 결제", "첫결제", "자급제",
]
# 제목에 있으면 제외합니다. 특정 카드 전용 행사를 거르기 위한 항목입니다.
ineligible_title = ["카드"]
# 제목에 있으면 행사 글이 아니라고 보고 제외합니다.
noise = [
  "받으세요", "랜덤", "클릭", "일일적립", "일일 적립", "라이브 예고", "모음", "문의", "질문", "상조",
  "가입자", "해외", "글로벌", "공략", "협약", "후기", "종료",
]
# 묶음 판단에서 무시할 흔한 낱말. 같은 행사의 기사를 하나로 묶을 때 씁니다.
group_stopwords = [
  "네이버페이", "네이버", "페이", "머니", "포인트", "npay", "삼성월렛", "삼성페이", "삼성", "월렛", "편의점",
  "결제", "결제액", "결제금액", "결제시", "적립", "할인", "혜택", "행사", "이벤트", "프로모션", "최대", "제공",
  "진행", "현장", "전", "제품", "한정", "즉시", "참여", "매장", "가맹점", "손잡고", "만원",
]

[news]
# 뉴스 검색어. Bing과 Google 뉴스 RSS에서 함께 찾습니다.
queries = [
  "네이버페이 적립", "네이버페이 할인", "네이버페이 결제 이벤트",
  "삼성월렛 적립", "삼성월렛 할인", "삼성페이 할인",
  "편의점 네이버페이", "편의점 삼성월렛", "편의점 결제 할인",
]

[community]
