name: 행사 수집 및 메일 전송

on:
  schedule:
    # 정각의 혼잡을 피해 약 15분마다 실행합니다.
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths: ["saving_events/**", "config.toml", ".github/workflows/run.yml"]
  workflow_dispatch:
    inputs:
      send_now:
        description: "지금 메일 보내기"
        type: boolean
        default: true
      include_sent:
        description: "이미 보낸 진행 중 행사도 포함"
        type: boolean
        default: false

concurrency:
  group: saving-events

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 시험
        run: python -m unittest discover -s tests -t .
      - name: 수집 및 전송
        env:
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEND_NOW: ${{ inputs.send_now }}
          INCLUDE_SENT: ${{ inputs.include_sent }}
        run: |
          args=""
          if [ "$SEND_NOW" = "true" ]; then args="$args --send-now"; fi
          if [ "$INCLUDE_SENT" = "true" ]; then args="$args --include-sent"; fi
          python -m saving_events $args
      - name: 상태 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update collected events"
          git pull --rebase
          git push
